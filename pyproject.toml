[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-marketplace-demo"
version = "0.1.0"
description = "Requester-controlled public-work marketplace and protected-execution research foundation"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
agent-market-demo = "agent_marketplace.demo:main"
agent-market = "agent_marketplace.market:main"
agent-worker = "agent_marketplace.worker:main"
agent-requester = "agent_marketplace.requester:main"

[tool.setuptools.packages.find]
include = ["agent_marketplace*"]

[tool.setuptools.package-data]
agent_marketplace = ["workloads/*/manifest.json", "workloads/*/fixtures/*.py"]
